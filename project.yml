name: SignFlow
options:
  bundleIdPrefix: com.bnto
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  generateEmptyDirectories: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.19"

targets:
  SignFlow:
    type: application
    platform: iOS
    sources:
      - SignFlow
    resources:
      - SignFlow/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bnto.signflow
        PRODUCT_NAME: SignFlow
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: true
    dependencies:
      - package: ZIPFoundation

  SignFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bnto.signflow.tests
    dependencies:
      - target: SignFlow
